; =============================================================================
;  ESDC STM32F446RE Starter — PlatformIO configuration
; =============================================================================
;
;  Each challenge is its own "environment" (env). Pick one in the VS Code
;  status bar (bottom of the window, it says "env:challenge0" by default),
;  then press Build (✓) and Upload (→).
;
;  From a terminal instead:
;      pio run -e challenge1               # build challenge 1
;      pio run -e challenge1 -t upload     # build + flash challenge 1
;
;  There is NO framework (no Arduino, no HAL). Everything that runs on the chip
;  is in this repo: src/startup_stm32f446.c, linker/stm32f446re.ld, and your code.
; =============================================================================

[platformio]
default_envs = challenge0

; ---- Settings shared by every challenge -------------------------------------
[env]
platform = ststm32
board = nucleo_f446re
board_build.ldscript = linker/stm32f446re.ld
build_flags = -Wall -Wextra -Wno-override-init
upload_protocol = stlink
debug_tool = stlink

; ---- One env per challenge --------------------------------------------------
; build_src_filter = "compile everything in src/ EXCEPT the challenges folder,
; then add back just this one challenge file". That way only one main() exists.

[env:challenge0]
build_src_filter = +<*> -<challenges/> +<challenges/challenge0_blink.c>

[env:challenge1]
build_src_filter = +<*> -<challenges/> +<challenges/challenge1_port_a.c>

[env:challenge2]
build_src_filter = +<*> -<challenges/> +<challenges/challenge2_other_ports.c>

[env:challenge3]
build_src_filter = +<*> -<challenges/> +<challenges/challenge3_button.c>

[env:challenge4]
build_src_filter = +<*> -<challenges/> +<challenges/challenge4_timer.c>

; Your own experiments: edit src/challenges/playground.c
[env:playground]
build_src_filter = +<*> -<challenges/> +<challenges/playground.c>
