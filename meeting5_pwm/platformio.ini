; =============================================================================
;  ESDC Meeting 5 — PWM with the ARDUINO framework
; =============================================================================
;
;  This is its own PlatformIO project, separate from the bare-metal challenges
;  one folder up. Meeting 5 uses the Arduino framework (analogWrite and friends)
;  so we can focus on PWM itself instead of registers.
;
;  To use it: in VS Code choose File -> Open Folder... and pick THIS folder
;  (meeting5_pwm, the one that contains this file). Then pick an env in the blue
;  bar at the bottom of the window, press Build (check mark) and Upload (arrow).
;
;  From a terminal inside this folder instead:
;      pio run -e challenge9               # build challenge 9
;      pio run -e challenge9 -t upload     # build + flash challenge 9
;
;  The FIRST build downloads the Arduino framework for STM32 (a few hundred
;  MB) and compiles it, which takes several minutes. Do this before the
;  meeting, with internet.
; =============================================================================

[platformio]
default_envs = challenge9

; ---- Settings shared by every challenge -------------------------------------
[env]
platform = ststm32
board = nucleo_f446re
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

; ---- One env per challenge --------------------------------------------------
; build_src_filter = "ignore everything in src/, then add back just this one
; file". That way only one setup()/loop() exists in each build.

[env:challenge9]
build_src_filter = -<*> +<challenge9_pwm_basics.cpp>

[env:challenge10]
build_src_filter = -<*> +<challenge10_pwm_fade.cpp>

[env:challenge11]
build_src_filter = -<*> +<challenge11_pwm_timers.cpp>

[env:challenge12]
build_src_filter = -<*> +<challenge12_pwm_scanner.cpp>

; Your own experiments: edit src/playground.cpp
[env:playground]
build_src_filter = -<*> +<playground.cpp>
